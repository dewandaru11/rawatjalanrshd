{% extends "base.html" %}
{% block content %}
<section class="page-banner"><div class="container"><p class="eyebrow">Area Pengelola</p><h1>Login Admin</h1><p>Halaman rancangan untuk pengelola website.</p></div></section>
<section class="container content-section form-section">
  <div class="warning-box">Autentikasi belum diaktifkan. Jangan gunakan untuk akun atau kata sandi sungguhan.</div>
  <form method="post" class="form-card">
    <label>Nama pengguna<input name="username" autocomplete="username" required></label>
    <label>Kata sandi<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Login (belum aktif)</button>
  </form>
</section>
{% endblock %}
